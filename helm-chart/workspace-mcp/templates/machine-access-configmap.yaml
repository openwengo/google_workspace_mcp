{{- if .Values.machineAccess.enabled }}
{{- $policy := required "machineAccess.policy is required" .Values.machineAccess.policy }}
{{- $wif := required "machineAccess.wif is required" .Values.machineAccess.wif }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "workspace-mcp.fullname" . }}-machine-access
  labels:
    {{- include "workspace-mcp.labels" . | nindent 4 }}
data:
  policy.json: |
    {{- $policy | toPrettyJson | nindent 4 }}
  wif.json: |
    {{- $wif | toPrettyJson | nindent 4 }}
{{- end }}
